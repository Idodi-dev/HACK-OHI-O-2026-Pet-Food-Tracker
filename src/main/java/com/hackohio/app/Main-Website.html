    <Style> 

 

        /* BEGIN SIGN IN PANEL FORMATING */ 

 

        #SignInPanel, .flip{ 

            padding: 10px; 

            text-align: center; 

            background-color: #04AA6D; 

            color: white; 

            border: solid 1px #a6d8a8; 

            margin: auto; 

            cursor:pointer; 

        } 

 

        /* END SIGN IN PANEL FORMATING */ 

 

        /* BEGIN TABLE FORMATING*/ 

 

        table {  

            font-family: arial, sans-serif;  

            border-collapse: collapse; 

            width: 100%; 

            color:#000000; 

        }        

 

        td, th { 

        border: 1px solid #dddddd; 

        text-align: left; 

        padding: 8px; 

        } 

 

        tr:nth-child(even) { 

            background-color: #dddddd; 

        } 

 

        /* END TABLE FORMATING */ 

 

        /* ADD PET POPUP FORMAT */ 

 

        /* Popup container - can be anything you want */ 

        .popup { 

            position: relative; 

            display: inline-block; 

            cursor: pointer; 

            -webkit-user-select: none; 

            -moz-user-select: none; 

            -ms-user-select: none; 

            user-select: none; 

        } 

 

        /* The actual popup */ 

        .popup .popuptext { 

            visibility: hidden; 

            width: 160px; 

            background-color: #555; 

            color: #fff; 

            text-align: center; 

            border-radius: 6px; 

            padding: 8px 0; 

            position: absolute; 

            z-index: 1; 

            bottom: 125%; 

            left: 50%; 

            margin-left: -80px; 

        } 

 

        /* Popup arrow */ 

        .popup .popuptext::after { 

            content: ""; 

            position: absolute; 

            top: 100%; 

            left: 50%; 

            margin-left: -5px; 

            border-width: 5px; 

            border-style: solid; 

            border-color: #555 transparent transparent transparent; 

        } 

 

        /* Toggle this class - hide and show the popup */ 

        .popup .show { 

            visibility: visible; 

            -webkit-animation: fadeIn 1s; 

            animation: fadeIn 1s; 

        } 

 

        /* Add animation (fade in the popup) */ 

        @-webkit-keyframes fadeIn { 

            from {opacity: 0;}  

            to {opacity: 1;} 

        } 

 

        @keyframes fadeIn { 

            from {opacity: 0;} 

            to {opacity:1 ;} 

        } 

 

        /* END ADD PET POPUP FORMATING */ 

    </Style> 

    <!--Main HTML and visuals--> 

    <body> 

        <!--SIGN IN PAGE--> 

        <center> 

         

        <!--WEBSITE TITLE--> 

        <h1 style="color:burlywood">Pet Food Tracker</h1> 

 

        <!--Sign in--> 

        <div id = "SignInPanel"> 

            <h2>Sign in:</h2> 

            <form> 

                <p id = SignInPlease>Please Sign In</p> 

                <label for="username">Username:</label><br> 

                <input type="text" id="username" name="username"><br> 

                <label for="password">Password:</label><br> 

                <input type="password" id="password" name="password"><br><br> 

                <button type="button" onclick="SignIn()">Sign in</button> 

            </form> 

        </div> 

 

        <!-- PET STATUS TABLES --> 

        <div id="PetAttributes"> 

            <table> 

                <td>Pet Name</td> 

                <td>Pet Species</td> 

                <td>Food type</td> 

                <td>Needs fed</td> 

                <td>Food supply low</td> 

            </table> 

        </div> 

 

        <h2 style="color:burlywood">Current Pet Status</h2> 

 

        <div class="popup" onclick="AddPetPopup()">Click me to turn on the popup! 

        <span class="popuptext" id="myPopup">A Simple Popup! 

         

            <label for="PetName">PetName:</label><br> 

            <input type="text" id="PetName" name="PetName"> 

             

            <label for="PetSpecies">PetName:</label><br> 

            <input type="text" id="PetSpecies" name="PetSpecies"> 

             

        </span> 

        </div> 

        <div type="button" onclick="InputPetInfo()">Pet info entered?</div> 

         

        </center> 

    </body>
